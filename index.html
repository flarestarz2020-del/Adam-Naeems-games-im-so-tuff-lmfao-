<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Bouncy Ball</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="playfield-wrap">
    <button id="startButton" class="start-button" type="button">Start</button>
    <canvas id="playfield" aria-label="Bouncy ball animation"></canvas>

    <!-- Click menu -->
    <div id="menu" class="ball-menu hidden">
      <button id="menuHit" class="menu-btn">👊 Hit</button>
      <button id="menuSpawn" class="menu-btn">✨ Spawn</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
